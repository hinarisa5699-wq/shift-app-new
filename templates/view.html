<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alohaシフト</title>
    <link rel="icon" href="{{ url_for('static', filename='icons/favicon.ico') }}" sizes="any">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/favicon-32.png') }}" sizes="32x32">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta name="theme-color" content="#0ea5b7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Alohaシフト">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(180deg, #ecfeff 0%, #f0fdfa 40%, #fff7ed 100%); min-height: 100vh; }
        .cell { font-size: 11px; line-height: 1.35; }
        .sticky-name { position: sticky; left: 0; background: #fff; z-index: 5; }
        /* 横スクロール（スマホでも最後の曜日まで見られるように） */
        #all-view { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
        #all-view table { width: max-content; min-width: 100%; }
        .sat { background: #ecfeff; }
        .sun { background: #fff1f2; }
        .hol { background: #fef3c7; }
        .aloha-header { background: linear-gradient(135deg, #0ea5b7 0%, #22c1a5 55%, #fb923c 130%); }
        .card { border-radius: 1rem; box-shadow: 0 8px 20px -12px rgba(13,148,136,.45); }
    </style>
</head>
<body>
<header class="aloha-header text-white shadow-lg">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
        <div class="flex items-center gap-2">
            <img src="{{ url_for('static', filename='icons/icon-192.png') }}" alt=""
                 class="w-9 h-9 rounded-xl shadow ring-1 ring-white/40">
            <div>
                <div class="text-lg font-bold leading-tight">Alohaシフト</div>
                <div class="text-[11px] opacity-90 leading-tight">シフト表</div>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <span id="updated" class="text-xs opacity-90"></span>
            <a href="{{ url_for('logout') }}" class="text-sm underline">ログアウト</a>
        </div>
    </div>
</header>

<main class="max-w-6xl mx-auto px-3 py-4">
    <div class="bg-white card p-3 mb-3">
        <div class="flex flex-wrap items-center gap-2">
            <button id="prev" class="px-3 py-2 rounded-lg bg-gray-100 text-gray-700 font-bold">◀</button>
            <select id="year" class="px-3 py-2 border border-gray-300 rounded-lg text-base"></select>
            <select id="month" class="px-3 py-2 border border-gray-300 rounded-lg text-base"></select>
            <button id="next" class="px-3 py-2 rounded-lg bg-gray-100 text-gray-700 font-bold">▶</button>
            <button id="reload" class="px-3 py-2 rounded-lg bg-teal-600 text-white font-bold">最新に更新</button>
            <button id="gcal-import" type="button"
                    class="hidden px-3 py-2 rounded-lg bg-white border border-teal-500 text-teal-700 font-bold">Googleカレンダー取り込み</button>
            <span id="status" class="text-sm px-2 py-1 rounded-full"></span>
        </div>
        <div id="gcal-msg" class="hidden mt-2 text-sm"></div>
        <div class="mt-3 flex flex-wrap items-center gap-2">
            <div class="inline-flex rounded-lg overflow-hidden border border-gray-300">
                <button id="tab-person" class="px-4 py-2 text-sm font-bold bg-teal-600 text-white">個人</button>
                <button id="tab-care" class="px-4 py-2 text-sm font-bold bg-white text-gray-700">介護・看護</button>
                <button id="tab-cook" class="px-4 py-2 text-sm font-bold bg-white text-gray-700">調理</button>
            </div>
            <select id="person" class="px-3 py-2 border border-gray-300 rounded-lg text-base flex-1 min-w-[10rem]"></select>
        </div>
    </div>

    <div id="week-bar" class="hidden bg-white card p-2 mb-3">
        <div class="flex items-center gap-2">
            <button id="week-prev" class="px-3 py-2 rounded-lg bg-gray-100 text-gray-700 font-bold">◀</button>
            <div id="week-label" class="flex-1 text-center font-bold text-gray-800"></div>
            <button id="week-next" class="px-3 py-2 rounded-lg bg-gray-100 text-gray-700 font-bold">▶</button>
            <button id="week-toggle" class="px-3 py-2 rounded-lg bg-gray-100 text-gray-700 text-sm font-bold whitespace-nowrap">月全体</button>
        </div>
    </div>

    <div id="empty" class="hidden bg-white card p-8 text-center text-gray-500">
        この月のシフトはまだ作成されていません。
    </div>

    <!-- 個人ビュー -->
    <div id="person-view" class="bg-white card overflow-hidden"></div>

    <!-- 全体ビュー -->
    <div id="all-view" class="hidden bg-white card overflow-auto"></div>

    <p class="text-xs text-gray-400 mt-4">
        シフトは自動作成システムと同じデータをそのまま表示しています（1分ごとに自動更新）。
        「予定を入れる」から入れたスケジュールは、その場で全員の画面に反映されます。
    </p>
</main>

<script>
const PLAN_EDIT_CATEGORIES = {{ plan_edit_categories | tojson }};
// 手入力のスケジュールを入れてよい職員ID（null = 全員入れられる）
const PLAN_EDITABLE_IDS = {{ plan_editable_staff_ids | tojson }};
const PLAN_ONLY_CATEGORIES = ['executive', 'office'];

const LABELS = {
    exec_off: '休',
    day_pattern1: 'デイ 8:30-17:30',
    day_pattern2: 'デイ 9:00-16:00',
    day_pattern3: 'デイ午前 8:30-12:30',
    day_pattern4: 'デイ午後 13:30-17:30',
    day_pattern5: 'デイ午後 12:30-16:30',
    early: '早番 7:30-16:30',
    late: '遅番 9:30-18:30',
    nurse_short: '看護 9:30-13:30',
    visit_am: '訪問 午前',
    visit_pm: '訪問 午後',
    day_p3_visit_pm: '兼務（デイ→訪問）',
    visit_am_day_p4: '兼務（訪問→デイ）',
    day_am: 'デイ 午前のみ',
    day_pm: 'デイ 午後のみ',
    day_am_visit_pm: '兼務（デイ→訪問）',
    visit_am_day_pm: '兼務（訪問→デイ）',
};
const DOW = ['月', '火', '水', '木', '金', '土', '日'];
// 職員ごとのIDでログインしたときは、その人のシフトを最初に開く（0＝共通ログイン）
const MY_STAFF_ID = {{ my_staff_id|default(0) }};
let state = {
    year: {{ default_year }}, month: {{ default_month }},
    mode: 'person', personId: (MY_STAFF_ID || null), data: null, group: 'care',
    weekIndex: 0, range: 'week',   // range: 'week' = 1画面1週間 / 'month' = 月全体
};

function el(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function initSelectors() {
    const y = el('year'), m = el('month');
    const now = new Date();
    for (let yy = now.getFullYear() - 1; yy <= now.getFullYear() + 2; yy++) {
        y.insertAdjacentHTML('beforeend', `<option value="${yy}">${yy}年</option>`);
    }
    for (let mm = 1; mm <= 12; mm++) {
        m.insertAdjacentHTML('beforeend', `<option value="${mm}">${mm}月</option>`);
    }
    y.value = state.year; m.value = state.month;
    y.onchange = () => { state.year = +y.value; state.weekPinned = false; load(); };
    m.onchange = () => { state.month = +m.value; state.weekPinned = false; load(); };
    el('prev').onclick = () => shiftMonth(-1);
    el('next').onclick = () => shiftMonth(1);
    el('reload').onclick = () => load();
    el('gcal-import').onclick = () => importGoogleCalendar();
    el('tab-person').onclick = () => setMode('person');
    el('tab-care').onclick = () => setMode('care');
    el('tab-cook').onclick = () => setMode('cook');
    el('person').onchange = () => {
        state.personId = +el('person').value;
        const st = ((state.data && state.data.staff_list) || []).find(s => s.id === state.personId);
        if (st) state.group = (st.department === 'cooking') ? 'cooking' : 'care';
        render();
    };
    el('week-prev').onclick = () => { state.weekIndex = Math.max(0, state.weekIndex - 1); state.weekPinned = true; render(); };
    el('week-next').onclick = () => { state.weekIndex = state.weekIndex + 1; state.weekPinned = true; render(); };
    el('week-toggle').onclick = () => {
        state.range = state.range === 'week' ? 'month' : 'week';
        el('week-toggle').textContent = state.range === 'week' ? '月全体' : '1週間ずつ';
        render();
    };
}

// 今日を含む週を初期表示に（別の月を見ているときは先頭の週）
function defaultWeekIndex() {
    const now = new Date();
    if (now.getFullYear() !== state.year || (now.getMonth() + 1) !== state.month) return 0;
    const nDays = daysInMonth(state.year, state.month);
    const dates = [];
    for (let d = 1; d <= nDays; d++) {
        const jsDow = new Date(state.year, state.month - 1, d).getDay();
        dates.push({ d, dow: (jsDow + 6) % 7 });
    }
    const weeks = splitWeeks(dates);
    const today = now.getDate();
    const idx = weeks.findIndex(w => w.some(x => x.d === today));
    return idx >= 0 ? idx : 0;
}

// 月の日付を週（月曜はじまり）ごとに分ける
function splitWeeks(dates) {
    const weeks = [];
    let cur = [];
    dates.forEach(d => {
        if (d.dow === 0 && cur.length) { weeks.push(cur); cur = []; }
        cur.push(d);
    });
    if (cur.length) weeks.push(cur);
    return weeks;
}

// いま見ている区分（介護・看護／調理）の職員を選ぶ
// 本人ログインのときは、最初の1回だけ、その人が調理なら「調理」タブに合わせる
//   （そのあとは職員がタブを切り替えられるように、二度と上書きしない）
let alignedToMe = false;
function alignGroupToMe() {
    if (!MY_STAFF_ID || alignedToMe) return;
    const list = (state.data && state.data.staff_list) || [];
    const me = list.find(s => s.id === MY_STAFF_ID);
    if (!me) return;
    state.group = (me.department === 'cooking') ? 'cooking' : 'care';
    alignedToMe = true;
}

function selectFirstOfGroup() {
    const list = (state.data && state.data.staff_list) || [];
    if (!list.length) return;
    const inGroup = s => (state.group === 'cooking')
        ? s.department === 'cooking' : s.department !== 'cooking';
    const cur = list.find(s => s.id === state.personId);
    if (cur && inGroup(cur)) return;      // すでにその区分の人を選んでいる
    const first = list.find(inGroup);
    if (first) {
        state.personId = first.id;
        const sel = el('person');
        if (sel) sel.value = String(first.id);
    }
}

function shiftMonth(delta) {
    let m = state.month + delta, y = state.year;
    if (m < 1) { m = 12; y--; } else if (m > 12) { m = 1; y++; }
    state.year = y; state.month = m;
    el('year').value = y; el('month').value = m;
    state.weekPinned = false;
    load();
}

function setMode(mode) {
    if (mode === 'care' || mode === 'cook') {
        state.group = (mode === 'cook') ? 'cooking' : 'care';
    }
    if (mode === 'person') selectFirstOfGroup();
    state.mode = mode;
    const on = 'px-4 py-2 text-sm font-bold bg-teal-600 text-white';
    const off = 'px-4 py-2 text-sm font-bold bg-white text-gray-700';
    el('tab-person').className = mode === 'person' ? on : off;
    el('tab-care').className = mode === 'care' ? on : off;
    el('tab-cook').className = mode === 'cook' ? on : off;
    el('person').style.display = mode === 'person' ? '' : 'none';
    render();
}

async function load() {
    const res = await fetch(`/api/shifts/${state.year}/${state.month}`, { cache: 'no-store' });
    if (!res.ok) { el('status').textContent = '読み込みに失敗しました'; return; }
    state.data = await res.json();
    el('updated').textContent = '更新 ' + new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
    if (!state.weekPinned) {
        state.weekIndex = defaultWeekIndex();
        state.weekPinned = true;
    }
    render();
}

function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }

function visitDays(data) {
    const od = data.operating_days || {};
    const set = new Set();
    (od.floor3_visit || []).concat(od.floor2_visit || []).forEach(d => set.add(d));
    return set;
}

// その日に「午前訪問」を明示的に割り当てられた職員がいるか
function hasExplicitAmVisit(data, dateStr) {
    const AM = ['visit_am', 'visit_am_day_p4', 'visit_am_day_pm'];
    return (data.shifts || []).some(x => x.date === dateStr
        && (AM.indexOf(x.assignment) !== -1 || x.visit_slot === 'am'));
}

function visitSlotOf(data, dateStr, sid) {
    const row = (data.shifts || []).find(x => x.date === dateStr && x.staff_id === sid);
    return row ? row.visit_slot : null;
}

// 予定も勤務も無い日（役員・事務）に出す印
const PLAN_DASH = '<span class="text-gray-300">-</span>';

// その職員のその日のスケジュール（手入力・何件でも）
function plansOf(data, dateStr, sid) {
    return ((data.plans || {})[dateStr] || {})[String(sid)] || [];
}

// この画面からスケジュールを入れてよい相手か
function canEditPlan(sid) {
    return PLAN_EDITABLE_IDS === null || PLAN_EDITABLE_IDS.indexOf(sid) !== -1;
}

function planLinesHtml(data, dateStr, sid) {
    return plansOf(data, dateStr, sid).map(pl =>
        `<div class="text-[11px] font-bold text-emerald-800 whitespace-nowrap">${esc(pl.label)}</div>`
    ).join('');
}

function cellHtml(data, sid, dateStr, assignment, visitSet, dow, withPlans) {
    // 個人ビューではスケジュールを別に描くので、ここでは付けない
    const planHtml = (withPlans === false) ? '' : planLinesHtml(data, dateStr, sid);
    const off = !assignment || assignment === 'off' || assignment === 'cook_off'
                || assignment === 'exec_off';
    // 役員は予定を入れた日だけ表示する（何も無い日は空欄）
    const staffOf = (data.staff_list || []).find(x => x.id === sid);
    if (!assignment && staffOf && PLAN_ONLY_CATEGORIES.indexOf(staffOf.job_category) !== -1) {
        return planHtml || PLAN_DASH;
    }
    if (off) {
        const ids = (data.day_off_requests || {})[dateStr] || [];
        return (ids.indexOf(sid) !== -1
            ? '<span class="text-amber-700 font-bold">希望休</span>'
            : '<span class="text-gray-400">休</span>') + planHtml;
    }
    const cookLabels = data.cook_labels || {};
    let label = assignment.indexOf('exec:') === 0 ? assignment.slice(5)
                : (LABELS[assignment] || cookLabels[assignment] || assignment);
    let extra = '';
    const slot = visitSlotOf(data, dateStr, sid);   // 'none' = この日は訪問に行かない
    const AM_CODES = ['visit_am', 'visit_am_day_p4'];
    const PM_CODES = ['visit_pm', 'day_p3_visit_pm'];
    if (slot === 'none') {
        // 何も付けない
    } else if (!slot && AM_CODES.indexOf(assignment) >= 0) {
        extra += '<br><span class="text-blue-700 font-bold">訪問（午前）</span>';
    } else if (!slot && PM_CODES.indexOf(assignment) >= 0) {
        extra += '<br><span class="text-indigo-700 font-bold">訪問（午後）</span>';
    } else if (slot) {
        extra += `<br><span class="text-blue-700 font-bold">訪問（${slot === 'am' ? '午前' : '午後'}）</span>`;
    }
    return `<span class="font-medium text-gray-800">${esc(label)}</span>${extra}${planHtml}`;
}

function dayClass(data, dateStr, dow) {
    if ((data.holidays || {})[dateStr]) return 'hol';
    if (dow === 5) return 'sat';
    if (dow === 6) return 'sun';
    return '';
}

function render() {
    const data = state.data;
    if (!data) return;
    const conf = data.confirmation;
    el('status').textContent = conf ? '確定済み' : '作成中（未確定）';
    el('status').className = 'text-sm px-2 py-1 rounded-full ' +
        (conf ? 'bg-green-100 text-green-800' : 'bg-amber-100 text-amber-800');

    const staffList = data.staff_list || [];
    updateGcalButton(staffList);
    const sel = el('person');
    alignGroupToMe();
    const sig = String(staffList.length) + ':' + staffList.map(s => s.id).join(',');
    if (sel.dataset.filled !== sig) {
        const care = staffList.filter(s => s.department !== 'cooking');
        const cook = staffList.filter(s => s.department === 'cooking');
        const opts = g => g.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
        sel.innerHTML =
            (care.length ? `<optgroup label="介護・看護">${opts(care)}</optgroup>` : '')
            + (cook.length ? `<optgroup label="調理">${opts(cook)}</optgroup>` : '');
        sel.dataset.filled = sig;
        if (!state.personId && staffList.length) state.personId = staffList[0].id;
        sel.value = state.personId;
    }

    // シフトがまだ無い月でも、個人ビューは出す（スケジュールを入れられるように）
    const hasShifts = (data.shifts || []).length > 0;
    const showPerson = state.mode === 'person' && staffList.length > 0;
    el('empty').classList.toggle('hidden', hasShifts);
    el('person-view').classList.toggle('hidden', !showPerson);
    el('all-view').classList.toggle('hidden', !hasShifts || state.mode === 'person');
    if (!hasShifts && !showPerson) { el('person-view').innerHTML = ''; el('all-view').innerHTML = ''; return; }

    // date -> staff_id -> assignment
    const map = {};
    (data.shifts || []).forEach(s => {
        (map[s.date] = map[s.date] || {})[s.staff_id] = s.assignment;
    });
    const visitSet = visitDays(data);
    const nDays = daysInMonth(state.year, state.month);
    const dates = [];
    for (let d = 1; d <= nDays; d++) {
        const dateStr = `${state.year}-${String(state.month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const jsDow = new Date(state.year, state.month - 1, d).getDay();
        dates.push({ d, dateStr, dow: (jsDow + 6) % 7 });   // 0=月
    }

    // 1画面1週間（月曜はじまり）。今日を含む週から開始する。
    const weeks = splitWeeks(dates);
    if (state.weekIndex >= weeks.length) state.weekIndex = weeks.length - 1;
    if (state.weekIndex < 0) state.weekIndex = 0;
    const useWeek = state.range === 'week' && weeks.length > 0;
    el('week-bar').classList.toggle('hidden', !hasShifts && !showPerson);
    if (useWeek) {
        const w = weeks[state.weekIndex];
        const first = w[0], last = w[w.length - 1];
        el('week-label').textContent =
            `${state.month}/${first.d}(${DOW[first.dow]}) 〜 ${state.month}/${last.d}(${DOW[last.dow]})`
            + `　第${state.weekIndex + 1}週 / 全${weeks.length}週`;
    } else {
        el('week-label').textContent = `${state.year}年${state.month}月（月全体）`;
    }
    el('week-prev').style.visibility = useWeek && state.weekIndex > 0 ? '' : 'hidden';
    el('week-next').style.visibility = useWeek && state.weekIndex < weeks.length - 1 ? '' : 'hidden';

    const shown = useWeek ? weeks[state.weekIndex] : dates;
    if (state.mode === 'person') renderPerson(data, map, shown, visitSet);
    else renderAll(data, map, shown, visitSet, state.mode === 'cook' ? 'cooking' : 'care');
}

function renderPerson(data, map, dates, visitSet) {
    const sid = state.personId;
    const staff = (data.staff_list || []).find(s => s.id === sid);
    if (!staff) { el('person-view').innerHTML = ''; return; }
    const canPlan = canEditPlan(sid);
    let work = 0;
    const rows = dates.map(({ d, dateStr, dow }) => {
        const a = (map[dateStr] || {})[sid];
        if (a && a !== 'off' && a !== 'cook_off' && a !== 'exec_off') work++;
        const oncall = (data.oncall || {})[dateStr] === staff.name;
        const hol = (data.holidays || {})[dateStr];
        const plans = plansOf(data, dateStr, sid);
        const planHtml = plans.map(pl =>
            `<div class="text-sm font-bold text-emerald-800">${esc(pl.label)}</div>`).join('');
        const addBtn = canPlan
            ? `<button type="button" onclick="openPlanEditor('${dateStr}', ${sid})"
                    class="mt-1 text-xs font-bold text-teal-700 bg-teal-50 border border-teal-200 rounded-lg px-2 py-1">
                    ${plans.length ? '予定を変える' : '＋ 予定を入れる'}</button>`
            : '';
        let shiftHtml = cellHtml(data, sid, dateStr, a, visitSet, dow, false);
        if (plans.length && shiftHtml === PLAN_DASH) shiftHtml = '';
        return `<tr class="${dayClass(data, dateStr, dow)} border-b border-gray-100">
            <td class="px-3 py-3 whitespace-nowrap w-24 align-top">
                <span class="font-bold">${state.month}/${d}</span>
                <span class="text-gray-500">(${DOW[dow]})</span>
                ${hol ? `<div class="text-[10px] text-amber-700">${esc(hol)}</div>` : ''}
            </td>
            <td class="px-3 py-3 align-top">
                ${shiftHtml}
                ${planHtml}${addBtn}</td>
            <td class="px-2 py-2 text-right align-top">${oncall ? '<span class="text-[10px] bg-red-100 text-red-700 rounded px-2 py-1 font-bold">オンコール</span>' : ''}</td>
        </tr>`;
    }).join('');
    const scope = state.range === 'week' ? 'この週' : 'この月';
    el('person-view').innerHTML = `
        <div class="px-4 py-3 bg-gray-50 border-b flex items-center justify-between">
            <div class="font-bold text-lg">${esc(staff.name)}</div>
            <div class="text-sm text-gray-600">${scope}の出勤 ${work} 日</div>
        </div>
        <table class="w-full text-base">${rows}</table>`;
}

function renderAll(data, map, dates, visitSet, group) {
    const all = data.staff_list || [];
    const staffList = group === 'cooking'
        ? all.filter(s => s.department === 'cooking')
        : all.filter(s => s.department !== 'cooking');
    const head = dates.map(({ d, dateStr, dow }) =>
        `<th class="px-1 py-1 border border-gray-200 ${dayClass(data, dateStr, dow)} cell whitespace-nowrap">
            ${state.month}/${d}<br>${DOW[dow]}
        </th>`).join('');
    const body = staffList.map(s => {
        const tds = dates.map(({ dateStr, dow }) => {
            const a = (map[dateStr] || {})[s.id];
            const w = state.range === 'week' ? 'min-width:96px' : 'min-width:74px';
            return `<td class="px-1 py-1 border border-gray-200 cell text-center ${dayClass(data, dateStr, dow)}"
                        style="${w}">${cellHtml(data, s.id, dateStr, a, visitSet, dow)}</td>`;
        }).join('');
        return `<tr><th class="px-2 py-1 border border-gray-200 sticky-name text-left cell whitespace-nowrap">${esc(s.name)}</th>${tds}</tr>`;
    }).join('');
    const oncallRow = group === 'cooking' ? '' :
        `<tr><th class="px-2 py-1 border border-gray-200 sticky-name text-left cell">オンコール</th>` +
        dates.map(({ dateStr, dow }) => {
            const n = (data.oncall || {})[dateStr] || '';
            return `<td class="px-1 py-1 border border-gray-200 cell text-center ${dayClass(data, dateStr, dow)}">${esc(n)}</td>`;
        }).join('') + '</tr>';
    el('all-view').innerHTML = `
        <table class="border-collapse">
            <thead><tr><th class="px-2 py-1 border border-gray-200 sticky-name cell">職員名</th>${head}</tr></thead>
            <tbody>${body}${oncallRow}</tbody>
        </table>`;
}

initSelectors();
setMode('person');

// 実際にシフトがある月を開く（今日の月に無ければ直近の月）
(async () => {
    try {
        const r = await fetch('/api/shifts/available', { cache: 'no-store' });
        if (r.ok) {
            const j = await r.json();
            if (j.default) {
                state.year = j.default.year;
                state.month = j.default.month;
                el('year').value = state.year;
                el('month').value = state.month;
            }
        }
    } catch (e) { /* 取れなければ今日の月のまま */ }
    await load();
})();
setInterval(load, 60000);   // 1分ごとに最新を取り込む

/* --- スケジュールをこの画面から入れる（1日に何件でも） ---
   ユーザー依頼 2026-08:「スケジュールは追加機能もいれて手入力も可能にしたい。
   例 デイ面接 9時から10時 本社10時から17時 みたいに、何個でもいれていいように」 */
let planEdit = null;   // {date, staffId, current, canOff}

// 役員・事務のセル（勤務欄）を「終日休み」にできるアカウントか
function canEditExecCell(staff) {
    if (!staff || PLAN_ONLY_CATEGORIES.indexOf(staff.job_category) === -1) return false;
    if (PLAN_EDIT_CATEGORIES.indexOf(staff.job_category) !== -1) return true;
    return staff.id === MY_STAFF_ID;      // 本人のアカウント
}

function planRowHtml(start, end, title) {
    return `<div class="plan-row border border-gray-200 rounded-lg p-2 bg-gray-50">
        <div class="flex items-center gap-1">
            <input type="time" value="${esc(start)}"
                   class="plan-start flex-1 min-w-0 px-2 py-2 border border-gray-300 rounded-lg text-base bg-white">
            <span class="text-gray-500">〜</span>
            <input type="time" value="${esc(end)}"
                   class="plan-end flex-1 min-w-0 px-2 py-2 border border-gray-300 rounded-lg text-base bg-white">
            <button type="button" onclick="removePlanRow(this)"
                    class="px-2 text-2xl leading-none text-gray-400" title="この予定を消す">×</button>
        </div>
        <input type="text" maxlength="40" value="${esc(title)}" placeholder="内容（例: デイ面接／本社）"
               class="plan-title mt-2 w-full px-2 py-2 border border-gray-300 rounded-lg text-base bg-white">
    </div>`;
}

function addPlanRow(start, end, title) {
    const box = el('plan-rows');
    if (box.querySelectorAll('.plan-row').length >= 20) {
        el('plan-msg').textContent = '1日に入れられる予定は20件までです';
        return;
    }
    box.insertAdjacentHTML('beforeend', planRowHtml(start || '', end || '', title || ''));
}

function removePlanRow(btn) {
    const row = btn.parentNode.parentNode;
    if (row && row.parentNode) row.parentNode.removeChild(row);
}

/* ============================================
   Googleカレンダーの取り込み（読み取りのみ）
   職員マスタにURLを入れた職員だけが対象。ボタンは対象がいるときだけ出す。
   ============================================ */
function gcalTargets(staffList) {
    return (staffList || []).filter(s => s.has_google_calendar
        && (PLAN_EDITABLE_IDS === null || PLAN_EDITABLE_IDS.indexOf(s.id) !== -1));
}

function updateGcalButton(staffList) {
    el('gcal-import').classList.toggle('hidden', gcalTargets(staffList).length === 0);
}

function showGcalMsg(text, ok) {
    const box = el('gcal-msg');
    box.textContent = text;
    box.className = 'mt-2 text-sm ' + (ok ? 'text-teal-700' : 'text-red-600');
    box.classList.remove('hidden');
}

async function importGoogleCalendar() {
    const targets = gcalTargets((state.data || {}).staff_list);
    if (!targets.length) return;
    const btn = el('gcal-import');
    btn.disabled = true;
    showGcalMsg('取り込み中...', true);
    const token = document.querySelector('meta[name="csrf-token"]').content;
    const head = { 'Content-Type': 'application/json', 'X-CSRFToken': token };
    const done = [];
    try {
        for (const st of targets) {
            const r = await fetch('/api/staff-plans/google-import', {
                method: 'POST', headers: head,
                body: JSON.stringify({
                    staff_id: st.id, year: state.year, month: state.month,
                }),
            });
            const j = await r.json();
            if (!r.ok) throw new Error(`${st.name}さん: ${j.error || '取り込めませんでした'}`);
            done.push(`${st.name}さん ${j.imported}件`
                + (j.private ? `（うち私用 ${j.private}件）` : ''));
        }
        await load();
        showGcalMsg(`${state.month}月の予定を取り込みました：` + done.join(' / '), true);
    } catch (e) {
        showGcalMsg(e.message, false);
    } finally {
        btn.disabled = false;
    }
}

function openPlanEditor(dateStr, staffId) {
    const data = state.data || {};
    const staff = (data.staff_list || []).find(x => x.id === staffId);
    const current = (((data.shifts || []).find(
        x => x.date === dateStr && x.staff_id === staffId) || {}).assignment) || '';
    planEdit = {
        date: dateStr, staffId: staffId, current: current,
        canOff: canEditExecCell(staff),
    };
    el('plan-rows').innerHTML = '';
    // Googleカレンダーから取り込んだ予定は読み取り専用（消して保存すると取り込み直すまで戻らない）
    const all = plansOf(data, dateStr, staffId);
    const fromGoogle = all.filter(pl => pl.source === 'google');
    el('plan-google').innerHTML = fromGoogle.map(pl =>
        `<div class="text-sm text-gray-700 bg-gray-50 border border-gray-200 rounded-lg px-2 py-1">${esc(pl.label)}</div>`
    ).join('');
    el('plan-google-box').classList.toggle('hidden', !fromGoogle.length);
    all.filter(pl => pl.source !== 'google')
       .forEach(pl => addPlanRow(pl.start_time, pl.end_time, pl.title));
    // 旧いやり方（勤務欄に入れた「exec:9:00-12:00 デイ面接」）は予定として引き継ぐ
    if (planEdit.canOff && current.indexOf('exec:') === 0) {
        const text = current.slice(5);
        const m = text.match(/^(\d{1,2}:\d{2})-(\d{1,2}:\d{2})\s*(.*)$/);
        if (m) addPlanRow(pad2(m[1]), pad2(m[2]), m[3] || '');
        else addPlanRow('', '', text);
    }
    if (!el('plan-rows').querySelectorAll('.plan-row').length) addPlanRow('', '', '');
    el('plan-off-row').classList.toggle('hidden', !planEdit.canOff);
    el('plan-off').checked = (current === 'exec_off');
    el('plan-who').textContent = staff ? staff.name + ' さん' : '';
    el('plan-when').textContent = dateStr.slice(5).replace('-', '/');
    el('plan-msg').textContent = '';
    el('plan-modal').classList.remove('hidden');
}

// "9:00" → "09:00"（<input type="time"> は2桁でないと受け付けない）
function pad2(t) {
    const m = String(t || '').match(/^(\d{1,2}):(\d{2})$/);
    return m ? String(m[1]).padStart(2, '0') + ':' + m[2] : '';
}

function closePlanEditor() {
    el('plan-modal').classList.add('hidden');
    planEdit = null;
}

function collectPlanRows() {
    return Array.from(el('plan-rows').querySelectorAll('.plan-row')).map(row => ({
        start: row.querySelector('.plan-start').value || '',
        end: row.querySelector('.plan-end').value || '',
        title: (row.querySelector('.plan-title').value || '').trim(),
    })).filter(x => x.start || x.end || x.title);
}

async function savePlans() {
    if (!planEdit) return;
    const items = collectPlanRows();
    if (items.some(x => !x.title)) {
        el('plan-msg').textContent = '内容を入力してください（時間だけの予定は入れられません）';
        return;
    }
    const token = document.querySelector('meta[name="csrf-token"]').content;
    const head = { 'Content-Type': 'application/json', 'X-CSRFToken': token };
    el('plan-msg').textContent = '保存中...';
    try {
        const r = await fetch('/api/staff-plans', {
            method: 'POST', headers: head,
            body: JSON.stringify({
                staff_id: planEdit.staffId, date: planEdit.date, items: items,
            }),
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || '保存できませんでした');
        // 役員・事務は勤務欄の「終日休み」も合わせて直す
        if (planEdit.canOff) {
            const want = el('plan-off').checked ? 'exec_off' : '';
            if (want !== planEdit.current) {
                const r2 = await fetch('/api/shift/cells', {
                    method: 'POST', headers: head,
                    body: JSON.stringify({
                        year: state.year, month: state.month,
                        changes: [{ date: planEdit.date, staff_id: planEdit.staffId,
                                    assignment: want }],
                    }),
                });
                const j2 = await r2.json();
                if (!r2.ok) throw new Error(j2.error || '休みの反映ができませんでした');
            }
        }
        closePlanEditor();
        await load();
    } catch (e) {
        el('plan-msg').textContent = e.message;
    }
}
</script>

<!-- スケジュールを入れる画面（1日に何件でも） -->
<div id="plan-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center px-4"
     style="background:rgba(0,0,0,.45)">
    <div class="bg-white rounded-2xl shadow-xl p-5 w-full max-w-md max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between mb-1">
            <span class="text-lg font-bold text-gray-800">スケジュール</span>
            <span id="plan-when" class="text-sm text-gray-500"></span>
        </div>
        <div id="plan-who" class="text-sm text-gray-500 mb-3"></div>

        <div id="plan-off-row" class="hidden mb-3">
            <label class="flex items-center gap-2 text-base font-bold text-gray-700">
                <input id="plan-off" type="checkbox" class="w-5 h-5">
                この日は終日休み
            </label>
        </div>

        <!-- Googleカレンダーから取り込んだ予定（ここでは直せない。取り込み直しで更新） -->
        <div id="plan-google-box" class="hidden mb-3">
            <div class="text-xs font-bold text-gray-600 mb-1">Googleカレンダーの予定</div>
            <div id="plan-google" class="space-y-1"></div>
            <p class="text-[11px] text-gray-500 mt-1">
                この予定はGoogleカレンダー側で直してください。直したあと「Googleカレンダー取り込み」を押すと反映されます。
            </p>
        </div>

        <div id="plan-rows" class="space-y-2 mb-2"></div>
        <button type="button" onclick="addPlanRow()"
                class="w-full border border-dashed border-teal-400 text-teal-700 font-bold py-2 rounded-lg mb-3">
            ＋ 予定を追加
        </button>
        <p class="text-[11px] text-gray-500 mb-2">
            例）9:00〜10:00 デイ面接 ／ 10:00〜17:00 本社。時間を空にすると終日の予定になります。
        </p>
        <div id="plan-msg" class="text-sm text-red-600 mb-2"></div>
        <div class="flex items-center gap-2">
            <button type="button" onclick="savePlans()"
                    class="flex-1 bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-lg">保存</button>
            <button type="button" onclick="closePlanEditor()"
                    class="bg-white border border-gray-300 text-gray-600 font-bold py-3 px-4 rounded-lg">やめる</button>
        </div>
    </div>
</div>
</body>
</html>
